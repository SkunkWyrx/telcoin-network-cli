name: Observer lifecycle (opt-in)
on:
  workflow_dispatch:
    inputs:
      network:
        type: choice
        options: [adiri, mainnet]
        default: adiri
      operation:
        type: choice
        options: [plan, snapshot-tick]
        default: plan
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
concurrency:
  group: observer-lifecycle-${{ inputs.network || 'adiri' }}
  cancel-in-progress: false
jobs:
  wake:
    if: github.ref == 'refs/heads/main' && vars.OBSERVER_AUTOMATION_ENABLED == 'true' && (inputs.network != 'mainnet' || vars.OBSERVER_MAINNET_ENABLED == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        if: inputs.network != 'mainnet' && vars.ADIRI_RUNNER_ON_DEMAND_ENABLED == 'true'
        with:
          client-id: ${{ vars.ADIRI_RUNNER_POWER_CLIENT_ID }}
          tenant-id: affb6d7e-3b1f-4fff-9c0d-83cf380f0d88
          subscription-id: 8a149d4d-c52a-4432-929e-de754584e269
      - name: Wake the Adiri management runner after approval
        if: inputs.network != 'mainnet' && vars.ADIRI_RUNNER_ON_DEMAND_ENABLED == 'true'
        run: python3 scripts/pool/runner_power.py start
  maintenance:
    needs: wake
    # No hosted runner has a route to private RPC. Provision this dedicated, trusted
    # runner explicitly; do not run this workflow on pull_request or untrusted code.
    if: vars.OBSERVER_AUTOMATION_ENABLED == 'true' && (inputs.network != 'mainnet' || vars.OBSERVER_MAINNET_ENABLED == 'true')
    runs-on: [self-hosted, "${{ inputs.network == 'mainnet' && 'observer-operations-mainnet' || 'observer-operations' }}"]
    env:
      OBSERVER_STATE_DIR: /var/lib/oprail-observers
      OBSERVER_NETWORK: ${{ inputs.network || 'adiri' }}
      OBSERVER_OPERATION: ${{ inputs.operation || 'snapshot-tick' }}
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate runner managed identity
        run: az login --identity --output none
      - name: Run configured lifecycle operation
        shell: bash
        run: |
          set -euo pipefail
          case "$OBSERVER_NETWORK" in adiri|mainnet) ;; *) exit 1 ;; esac
          case "$OBSERVER_OPERATION" in
            plan) python3 scripts/pool/fleet.py --config "/etc/oprail-observers/$OBSERVER_NETWORK/pool.json" plan ;;
            snapshot-tick) python3 scripts/pool/snapshot_tick.py --config "/etc/oprail-observers/$OBSERVER_NETWORK/pool.json" ;;
            *) exit 1 ;;
          esac
  sleep:
    needs: [wake, maintenance]
    if: always() && needs.wake.result == 'success' && inputs.network != 'mainnet' && vars.ADIRI_RUNNER_ON_DEMAND_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.ADIRI_RUNNER_POWER_CLIENT_ID }}
          tenant-id: affb6d7e-3b1f-4fff-9c0d-83cf380f0d88
          subscription-id: 8a149d4d-c52a-4432-929e-de754584e269
      - run: python3 scripts/pool/runner_power.py stop
