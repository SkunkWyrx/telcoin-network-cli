pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events {}
http {
  access_log off;
  server {
    listen 127.0.0.1:18443 ssl;
    server_name adiri-orbs.oprail.com;
    ssl_certificate /proof/tls.crt;
    ssl_certificate_key /proof/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;
    location = / {
      limit_except POST { deny all; }
      auth_request /_ready;
      error_page 500 =503 /_unavailable;
      # This proof forwards one fixed method, never the client's RPC body.
      proxy_set_header Content-Type application/json;
      proxy_set_body '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}';
      proxy_pass http://127.0.0.1:8545;
      proxy_connect_timeout 3s;
      proxy_read_timeout 10s;
    }
    location = /_ready {
      internal;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_connect_timeout 2s;
      proxy_read_timeout 2s;
      proxy_pass http://127.0.0.1:19090/readyz;
    }
    location = /_unavailable { internal; return 503; }
    location / { return 404; }
  }
}
